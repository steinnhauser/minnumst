name: CI

on:
  push:
    branches: [main]
    # Component releases, created by `make release`.
    tags: ["api-*", "web-*", "admin-*", "deploy-*"]
  pull_request:
  schedule:
    # Weekly, to catch new vulnerabilities in unchanged code and images.
    - cron: "17 4 * * 1"
  workflow_dispatch:

# Jobs request only what they need; actions are pinned to commit SHAs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a release that has started publishing.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Documentation-only changes skip the slower jobs. Tags, the weekly schedule
  # and manual runs always run everything.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          range=""
          if [[ $EVENT == pull_request ]]; then
            range="$BASE...HEAD"
          elif [[ $EVENT == push && $REF == refs/heads/* ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..HEAD"
          fi
          # No pipe into grep -q: with pipefail, its early exit would fail git diff.
          if [[ -z $range ]] || grep -vE '(\.md$|^docs/|^LICENSE$)' <<<"$(git diff --name-only "$range")" > /dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  checks:
    name: checks (format, lint, OpenAPI, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.2
          tofu_wrapper: false
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.1
          cache: true
      - run: make format-check lint openapi-check build

  tests:
    name: tests (API on SQLite and PostgreSQL, frontends)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - run: make test test-postgres
      - name: Summarise coverage and check the README's table
        if: ${{ !cancelled() }}
        run: |
          { echo '### Test coverage'; echo; python3 tools/scripts/coverage_report.py; } >> "$GITHUB_STEP_SUMMARY"
          python3 tools/scripts/coverage_report.py --check

  e2e:
    name: e2e (images, stack, edge, backups, browsers, image scan)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - name: Install Chromium for the browser tests
        run: npx playwright install --with-deps chromium
      - name: Build, start, seed and test the stack, Traefik included
        run: make stack-test
      - name: Show service logs
        if: failure()
        run: docker compose --project-name minnumst-local logs --tail 100
      - name: Keep the browser test traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.1
          cache: true
      - name: Scan the images and record every finding
        run: |
          mkdir -p "$RUNNER_TEMP/trivy"
          for image in api public admin; do
            trivy image --scanners vuln --format sarif --no-progress \
              --output "$RUNNER_TEMP/trivy/$image.sarif" "minnumst-local/$image:dev"
            # One code scanning category per image.
            jq --arg id "trivy/$image/" '.runs[].automationDetails.id = $id' \
              "$RUNNER_TEMP/trivy/$image.sarif" > "$RUNNER_TEMP/trivy/$image.tmp"
            mv "$RUNNER_TEMP/trivy/$image.tmp" "$RUNNER_TEMP/trivy/$image.sarif"
          done
      - name: Publish the findings to code scanning
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/trivy
      - name: Block fixable high and critical vulnerabilities
        run: |
          for image in api public admin; do
            trivy image --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL \
              --exit-code 1 --no-progress "minnumst-local/$image:dev"
          done
      - name: Stop the stack
        if: always()
        run: make down

  codeql:
    name: codeql (${{ matrix.language }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  host:
    name: host (hardening on Ubuntu 24.04, idempotence, Lynis)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Applies the host role to this runner: a real Ubuntu 24.04 VM.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - name: Install Lynis and score the stock image
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lynis
          sudo lynis audit system --quick --no-colors > "$RUNNER_TEMP/lynis-before.txt"
      - name: Attach a scratch block device as the data volume
        id: volume
        run: |
          truncate --size 512M "$RUNNER_TEMP/data.img"
          echo "device=$(sudo losetup --find --show "$RUNNER_TEMP/data.img")" >> "$GITHUB_OUTPUT"
      - name: Apply the host role twice; the second run must change nothing
        env:
          DATA_DEVICE: ${{ steps.volume.outputs.device }}
        run: |
          printf '[minnumst]\nlocalhost ansible_connection=local\n' > "$RUNNER_TEMP/inventory"
          # The loop device stands in for the encrypted data volume. Upgrading every
          # package, removing snapd or scanning the runner's large filesystem for
          # an AIDE baseline would only slow CI down.
          set -o pipefail
          overrides=$(jq -nc --arg device "$DATA_DEVICE" \
            '{host_data_device: $device, host_upgrade_packages: false, host_remove_snapd: false, host_aide_baseline: false}')
          for run in first second; do
            make deploy INVENTORY="$RUNNER_TEMP/inventory" VAULT_ARGS= ARGS="--tags host -e '$overrides'" \
              | tee "$RUNNER_TEMP/$run.log"
          done
          grep -E 'localhost +: ok=[0-9]+ +changed=0 +unreachable=0 +failed=0' "$RUNNER_TEMP/second.log"
      - name: Check that the data volume is encrypted and mounted
        run: |
          sudo cryptsetup status minnumst-data | grep -E 'type: +LUKS2'
          findmnt --noheadings --output SOURCE /srv/minnumst | grep -x /dev/mapper/minnumst-data
      - name: Score the hardened host
        run: |
          sudo lynis audit system --quick --no-colors > "$RUNNER_TEMP/lynis-after.txt"
          before=$(grep -oP 'Hardening index : \K[0-9]+' "$RUNNER_TEMP/lynis-before.txt")
          after=$(grep -oP 'Hardening index : \K[0-9]+' "$RUNNER_TEMP/lynis-after.txt")
          printf '### Lynis hardening index\n\nStock Ubuntu 24.04 runner: **%s**. After the host role: **%s**.\n' \
            "$before" "$after" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$after" -gt "$before"

  # With squash merging the title becomes the commit on main that
  # `make release` reads, so it must be a Conventional Commit.
  pr-title:
    name: pull request title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require a Conventional Commit title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\((api|web|admin|deploy|deps)\))?!?: .+'
          [[ $TITLE =~ $pattern ]] || { echo "Use a Conventional Commit title, for example 'fix(api): ...'."; exit 1; }

  ci-ok:
    name: ci-ok
    if: always()
    needs:
      [changes, checks, tests, e2e, host, codeql, dependency-review, pr-title]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every job to succeed (skipped jobs are fine)
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: test "$FAILED" = false

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [checks, tests, e2e, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the tag and read the release metadata
        id: meta
        run: python3 tools/scripts/release.py verify "$GITHUB_REF_NAME" --notes "$RUNNER_TEMP/notes.md" >> "$GITHUB_OUTPUT"
      - if: steps.meta.outputs.image
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - if: steps.meta.outputs.image
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: steps.meta.outputs.image
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push the multi-arch image
        if: steps.meta.outputs.image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ steps.meta.outputs.dockerfile }}
          build-args: ${{ steps.meta.outputs.build_args }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.minor }}
          labels: |
            org.opencontainers.image.title=${{ steps.meta.outputs.image }}
            org.opencontainers.image.description=${{ steps.meta.outputs.description }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          annotations: |
            index:org.opencontainers.image.description=${{ steps.meta.outputs.description }}
            index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            index:org.opencontainers.image.licenses=Apache-2.0
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.meta.outputs.title }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md"
