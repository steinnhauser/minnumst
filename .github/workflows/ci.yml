name: CI

on:
  push:
    branches: [main]
    # Component releases, created by `make release`.
    tags: ["api-*", "web-*", "admin-*", "deploy-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a release that has started publishing.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  checks:
    name: checks (format, lint, OpenAPI, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: make format-check lint openapi-check build

  tests:
    name: tests (API on SQLite and MariaDB, frontends)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: make test test-mariadb

  e2e:
    name: e2e (images and full stack with MariaDB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build, start, seed and test the stack
        run: make stack-test
      - name: Check that both frontends serve on their host ports
        run: |
          curl -fsS http://127.0.0.1:5173/runtime-config.js
          curl -fsS http://127.0.0.1:5174/runtime-config.js
      - name: Stop the stack
        if: always()
        run: make down

  ci-ok:
    name: ci-ok
    if: always()
    needs: [checks, tests, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        run: test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = false

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [checks, tests, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify the tag and read the release metadata
        id: meta
        run: python3 tools/scripts/release.py verify "$GITHUB_REF_NAME" --notes "$RUNNER_TEMP/notes.md" >> "$GITHUB_OUTPUT"
      - if: steps.meta.outputs.image
        uses: docker/setup-qemu-action@v4
      - if: steps.meta.outputs.image
        uses: docker/setup-buildx-action@v4
      - if: steps.meta.outputs.image
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push the multi-arch image
        if: steps.meta.outputs.image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ steps.meta.outputs.dockerfile }}
          build-args: ${{ steps.meta.outputs.build_args }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.minor }}
          labels: |
            org.opencontainers.image.title=${{ steps.meta.outputs.image }}
            org.opencontainers.image.description=${{ steps.meta.outputs.description }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          annotations: |
            index:org.opencontainers.image.description=${{ steps.meta.outputs.description }}
            index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            index:org.opencontainers.image.licenses=Apache-2.0
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.meta.outputs.title }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md"
