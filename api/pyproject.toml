[project]
authors = [{name = "Steinn Hauser Magnússon", email = "hausersteinn@gmail.com"}]
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.54.0,<1.0",
]
description = "Central CRUD API for the Minnumst people archive"
name = "minnumst-api"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
version = "0.2.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling>=1.32.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/minnumst_api"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
