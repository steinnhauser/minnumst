[project]
authors = [{name = "Steinn Hauser Magnússon", email = "hausersteinn@gmail.com"}]
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "pymysql>=1.1,<2.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.32,<1.0",
]
description = "Central CRUD API for the Eftirmal people archive"
name = "eftirmal-api"
readme = "README.md"
requires-python = ">=3.11"
version = "0.1.0"

[dependency-groups]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.3,<9.0",
  "ruff>=0.8,<1.0",
  "testcontainers[mysql]>=4.10,<5.0",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling>=1.26"]

[tool.hatch.build.targets.wheel]
packages = ["src/eftirmal_api"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
