---
minnumst_deploy_dir: /opt/minnumst
minnumst_compose_project: minnumst
# TODO: Set the production public hostname; point its DNS record to the server IP.
minnumst_domain: minnumst.example
# TODO: Set the production admin hostname; point its DNS record to the server IP.
minnumst_admin_domain: admin.minnumst.example
# TODO: Set the production API hostname; point its DNS record to the server IP.
minnumst_api_domain: api.minnumst.example
minnumst_admin_debug: "false"
minnumst_log_level: INFO

minnumst_public_image: ghcr.io/steinnhauser/minnumst-web:0.1.1
minnumst_admin_image: ghcr.io/steinnhauser/minnumst-admin:0.2.1
minnumst_api_image: ghcr.io/steinnhauser/minnumst-api:0.1.2

traefik_image: traefik:v3.7.16
docker_socket_proxy_image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0
# TODO: Set a monitored email address for Let's Encrypt certificate notices.
traefik_acme_email: ops@example.com
traefik_acme_ca_server: https://acme-v02.api.letsencrypt.org/directory
# TODO: Set the reachable Authentik Traefik outpost URL for this deployment.
authentik_forwardauth_address: https://auth.example.com/outpost.goauthentik.io/auth/traefik

postgres_image: postgres:18-alpine
postgres_database: minnumst
postgres_user: minnumst

# Host hardening overrides (defaults and references in roles/host/defaults/main.yml).
# Restrict SSH to known networks, for example a VPN or your office address:
# host_ssh_allowed_ipv4: ["203.0.113.0/24"]
# host_ssh_allowed_ipv6: ["2001:db8::/32"]
