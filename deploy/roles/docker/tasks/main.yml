---
- name: Install Docker repository prerequisites
  ansible.builtin.apt:
    name: [ca-certificates, curl, python3-debian]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install Docker's repository signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

- name: Read the package architecture
  ansible.builtin.command:
    argv: [dpkg, --print-architecture]
  register: docker_architecture
  changed_when: false

- name: Configure Docker's signed apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: [https://download.docker.com/linux/ubuntu]
    suites: ["{{ ansible_distribution_release }}"]
    components: [stable]
    architectures: ["{{ docker_architecture.stdout }}"]
    signed_by: /etc/apt/keyrings/docker.asc
    state: present

- name: Harden the Docker daemon (CIS Docker Benchmark 2)
  ansible.builtin.copy:
    src: daemon.json
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify: Restart Docker

- name: Install Docker Engine and the Compose plugin
  ansible.builtin.apt:
    name:
      [
        docker-ce,
        docker-ce-cli,
        containerd.io,
        docker-buildx-plugin,
        docker-compose-plugin,
      ]
    state: present
    update_cache: true

- name: Audit Docker's files and binaries (CIS Docker Benchmark 1.1)
  ansible.builtin.copy:
    src: audit.rules
    dest: /etc/audit/rules.d/61-docker.rules
    owner: root
    group: root
    mode: "0640"
  notify: Load audit rules

- name: Run Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
