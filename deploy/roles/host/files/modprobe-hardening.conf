# Managed by Ansible (deploy/roles/host). CIS Ubuntu 24.04 §1.1.1 and §3.2.
# Filesystems and protocols the host never uses cannot be loaded. squashfs
# stays available because Ubuntu's kernel packaging can rely on it.
install cramfs /bin/false
install freevxfs /bin/false
install hfs /bin/false
install hfsplus /bin/false
install jffs2 /bin/false
install udf /bin/false
install usb-storage /bin/false
install dccp /bin/false
install rds /bin/false
install sctp /bin/false
install tipc /bin/false
blacklist cramfs
blacklist freevxfs
blacklist hfs
blacklist hfsplus
blacklist jffs2
blacklist udf
blacklist usb-storage
blacklist dccp
blacklist rds
blacklist sctp
blacklist tipc
