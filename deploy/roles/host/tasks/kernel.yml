---
- name: Harden kernel and network parameters (CIS 1.5, 3.3)
  ansible.builtin.template:
    src: sysctl.conf.j2
    dest: /etc/sysctl.d/60-minnumst-hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify: Apply kernel parameters

- name: Disable unused filesystems and network protocols (CIS 1.1.1, 3.2)
  ansible.builtin.copy:
    src: modprobe-hardening.conf
    dest: /etc/modprobe.d/60-minnumst-hardening.conf
    owner: root
    group: root
    mode: "0644"

- name: Create the systemd drop-in directories this role writes to
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: [/etc/systemd/coredump.conf.d, /etc/systemd/journald.conf.d]

- name: Disable core dumps (CIS 1.5)
  ansible.builtin.copy:
    dest: "{{ item.dest }}"
    content: "{{ item.content }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - dest: /etc/security/limits.d/60-minnumst-coredump.conf
      content: "* hard core 0\n"
    - dest: /etc/systemd/coredump.conf.d/60-minnumst.conf
      content: "[Coredump]\nStorage=none\nProcessSizeMax=0\n"
  loop_control:
    label: "{{ item.dest }}"

- name: Mount /dev/shm without devices, setuid or executables (CIS 1.1.2)
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^\S+\s+/dev/shm\s'
    line: "tmpfs /dev/shm tmpfs defaults,nodev,nosuid,noexec 0 0"
  notify: Remount /dev/shm

- name: Keep AppArmor enabled (CIS 1.3, NIST AC-3)
  ansible.builtin.service:
    name: apparmor
    state: started
    enabled: true
