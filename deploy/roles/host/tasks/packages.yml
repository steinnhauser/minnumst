---
- name: Upgrade all packages (NIST SI-2)
  ansible.builtin.apt:
    upgrade: dist
    update_cache: true
    cache_valid_time: 3600
  when: host_upgrade_packages

- name: Install the security baseline
  ansible.builtin.apt:
    name:
      - apparmor
      - apparmor-utils
      - auditd
      - chrony
      - needrestart
      - nftables
      - openssh-server
      - sudo
      - unattended-upgrades
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Remove legacy network clients (CIS 2.2, NIST CM-7)
  ansible.builtin.apt:
    name: "{{ host_removed_packages }}"
    state: absent
    purge: true

- name: Remove snapd, which the host does not use (NIST CM-7)
  ansible.builtin.apt:
    name: snapd
    state: absent
    purge: true
  when: host_remove_snapd

- name: Install security and Docker updates automatically (NIST SI-2)
  ansible.builtin.template:
    src: unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/52minnumst-unattended-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Run unattended upgrades daily
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
    owner: root
    group: root
    mode: "0644"

- name: Restart services that use upgraded libraries automatically
  ansible.builtin.copy:
    dest: /etc/needrestart/conf.d/60-minnumst.conf
    content: |
      # Restart affected services after upgrades without asking.
      $nrconf{restart} = 'a';
    owner: root
    group: root
    mode: "0644"

- name: Attach Ubuntu Pro for Livepatch and expanded security maintenance
  ansible.builtin.command:
    argv: [pro, attach, "{{ host_ubuntu_pro_token }}"]
    creates: /var/lib/ubuntu-advantage/private/machine-token.json
  no_log: true
  when: host_ubuntu_pro_token | length > 0
