---
# Nightly PostgreSQL backups (NIST SP 800-53 CP-9), kept on the encrypted disk.
# On the encrypted data volume when there is one (host_data_device).
minnumst_backup_dir: "{{ (host_data_mount ~ '/backups') if host_data_device | default('') | length > 0 else '/var/backups/minnumst' }}"
minnumst_backup_retention_days: 14
# An age public key (age1...). When set, every dump is encrypted to it, and the
# host can't read its own backups; keep the private key off the server.
minnumst_backup_age_recipient: ""

# After deploying, check the live site from the machine running Ansible: HTTPS
# with HSTS, public reads, and authentication on the editorial desk and on writes.
minnumst_smoke_test: true
