# Applied by Authentik's worker. Puts the editorial desk and API writes behind a
# login with mandatory TOTP, restricted to two groups (NIST IA-2, AC-3).
version: 1
metadata:
  name: Minnumst - editorial access
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Authentication flow
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - TOTP MFA setup flow
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Provider authorization flow (implicit consent)
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Provider invalidation flow
      required: true

  # Every login needs TOTP; an account without a device must set one up first.
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    identifiers:
      name: default-authentication-mfa-validation
    attrs:
      device_classes: [totp]
      not_configured_action: configure
      configuration_stages:
        - !Find [
            authentik_stages_authenticator_totp.authenticatortotpstage,
            [name, default-authenticator-totp-setup],
          ]

  - model: authentik_core.group
    id: editors
    identifiers:
      name: minnumst-editors

  # Domain level, because the desk calls the API on another hostname: the session
  # cookie has to reach both.
  - model: authentik_providers_proxy.proxyprovider
    id: provider
    identifiers:
      name: minnumst-forward-auth
    attrs:
      mode: forward_domain
      external_host: !Format [https://%s, !Env MINNUMST_AUTHENTIK_HOST]
      cookie_domain: !Env MINNUMST_COOKIE_DOMAIN
      access_token_validity: hours=8
      authorization_flow:
        !Find [
          authentik_flows.flow,
          [slug, default-provider-authorization-implicit-consent],
        ]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

  - model: authentik_core.application
    id: application
    identifiers:
      slug: minnumst
    attrs:
      name: Minnumst
      provider: !KeyOf provider
      policy_engine_mode: any

  # An application without bindings lets every user in. Only these two groups pass.
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf application
      order: 0
    attrs:
      group: !KeyOf editors
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf application
      order: 1
    attrs:
      group: !Find [authentik_core.group, [name, authentik Admins]]

  # The outpost built into Authentik's server answers Traefik's forward-auth calls.
  - model: authentik_outposts.outpost
    identifiers:
      managed: goauthentik.io/outposts/embedded
    attrs:
      name: authentik Embedded Outpost
      type: proxy
      providers:
        - !KeyOf provider
      config:
        authentik_host: !Format [https://%s, !Env MINNUMST_AUTHENTIK_HOST]
