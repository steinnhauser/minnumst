---
- name: Check the deployment settings
  ansible.builtin.assert:
    that:
      - minnumst_domain | length > 0
      - minnumst_public_image | length > 0
      - minnumst_admin_image | length > 0
      - minnumst_api_image | length > 0
      - minnumst_log_level in ["DEBUG", "INFO", "WARNING", "ERROR"]
      - authentik_forwardauth_address | length > 0
      - traefik_acme_email | length > 0
      - postgres_superuser_password is match('^[A-Za-z0-9_-]{32,}$')
      - postgres_password is match('^[A-Za-z0-9_-]{32,}$')
      - postgres_migration_password is match('^[A-Za-z0-9_-]{32,}$')
      - "'REPLACE' not in postgres_superuser_password + postgres_password + postgres_migration_password"
    fail_msg: >-
      Set the image, domain, Authentik and ACME variables, and use random
      URL-safe PostgreSQL passwords of at least 32 characters in the vault.
  no_log: true

- name: Create the deployment directory
  ansible.builtin.file:
    path: "{{ minnumst_deploy_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Install the PostgreSQL role setup script
  ansible.builtin.copy:
    src: postgres-roles.sh
    dest: "{{ minnumst_deploy_dir }}/postgres-roles.sh"
    owner: root
    group: root
    mode: "0644"

- name: Render the Compose file, readable by root only (it holds secrets)
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ minnumst_deploy_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0600"

- name: Validate the rendered Compose file
  ansible.builtin.command:
    argv: "{{ minnumst_compose + ['config', '--quiet'] }}"
  changed_when: false

- name: Pull and start the stack (migrations run first)
  ansible.builtin.command:
    argv: "{{ minnumst_compose + ['up', '--detach', '--remove-orphans', '--pull', 'always'] }}"
  changed_when: true

- name: Smoke test the live site from outside the host
  when: minnumst_smoke_test
  delegate_to: localhost
  become: false
  run_once: true
  block:
    - name: The public archive answers over HTTPS with HSTS (NIST SC-8)
      ansible.builtin.uri:
        url: "https://{{ minnumst_domain }}/"
        status_code: 200
      register: minnumst_smoke_public
      # Certificates can take a moment to be issued on the first deploy.
      retries: 30
      delay: 10
      until: minnumst_smoke_public.status == 200

    - name: Require HSTS on the public archive
      ansible.builtin.assert:
        that: "'max-age=' in minnumst_smoke_public.strict_transport_security | default('')"
        fail_msg: The public archive did not send Strict-Transport-Security.

    - name: The API serves public reads
      ansible.builtin.uri:
        url: "https://{{ minnumst_api_domain }}/api/people?limit=1"
        status_code: 200

    - name: The editorial desk and API writes refuse unauthenticated requests (NIST AC-3)
      ansible.builtin.uri:
        url: "{{ item.url }}"
        method: "{{ item.method }}"
        follow_redirects: none
        # Authentik answers with a redirect to its login page, or 401.
        status_code: [302, 401]
      loop:
        - { url: "https://{{ minnumst_admin_domain }}/", method: GET }
        - { url: "https://{{ minnumst_api_domain }}/api/people", method: POST }
      loop_control:
        label: "{{ item.method }} {{ item.url }}"

- name: Install age to encrypt backups
  ansible.builtin.apt:
    name: age
    state: present
  when: minnumst_backup_age_recipient | length > 0

- name: Create the backup directory, readable by root only
  ansible.builtin.file:
    path: "{{ minnumst_backup_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Install the backup and restore scripts (NIST CP-9, CP-10)
  ansible.builtin.template:
    src: "{{ item }}.sh.j2"
    dest: "/usr/local/sbin/{{ item }}"
    owner: root
    group: root
    mode: "0750"
  loop: [minnumst-backup, minnumst-restore]

- name: Install the backup service
  ansible.builtin.template:
    src: minnumst-backup.service.j2
    dest: /etc/systemd/system/minnumst-backup.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Install the nightly backup timer
  ansible.builtin.copy:
    src: minnumst-backup.timer
    dest: /etc/systemd/system/minnumst-backup.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Run the backup nightly
  ansible.builtin.systemd_service:
    name: minnumst-backup.timer
    state: started
    enabled: true
    daemon_reload: true
