---
# Hardens an Ubuntu Server 24.04 LTS host and deploys Minnumst on it.
#   make deploy                         everything
#   make deploy ARGS="--tags host"      only the OS hardening
# Roles: host (OS hardening), docker (container engine), minnumst (the stack).
- name: Harden the host and deploy Minnumst
  hosts: minnumst
  become: true
  gather_facts: true
  roles:
    - role: host
      tags: [host]
    - role: docker
      tags: [docker]
    - role: minnumst
      tags: [app]
