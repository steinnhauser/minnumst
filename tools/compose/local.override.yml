# Local builds on top of the deploy/ Compose template. Paths are relative to
# the rendered file in tools/compose/.local/; build contexts are the repository root.
services:
  # The production edge, on loopback ports only (see `make edge`).
  traefik:
    ports: !override
      - "127.0.0.1:8088:80"
      - "127.0.0.1:8443:443"

  # Stands in for Authentik's forward-auth endpoint: it allows a request only
  # when it carries the local test token.
  auth-stub:
    image: python:3.13-slim-trixie
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "65534:65534"
    command:
      - python
      - -c
      - |
        from http.server import BaseHTTPRequestHandler, HTTPServer

        class ForwardAuth(BaseHTTPRequestHandler):
            def do_GET(self):
                allowed = self.headers.get("Authorization") == "Bearer local-edge-test"
                self.send_response(200 if allowed else 401)
                self.end_headers()

            def log_message(self, *args):
                pass

        HTTPServer(("0.0.0.0", 9000), ForwardAuth).serve_forever()
    networks: [edge]

  public:
    image: minnumst-local/public:dev
    build:
      context: ../../..
      dockerfile: docker/frontend.Dockerfile
      args:
        APP: web
        SERVICE_NAME: minnumst-public
    environment:
      VITE_API_URL: http://127.0.0.1:8000
    ports:
      - "127.0.0.1:5173:8080"

  admin:
    image: minnumst-local/admin:dev
    build:
      context: ../../..
      dockerfile: docker/frontend.Dockerfile
      args:
        APP: admin
        SERVICE_NAME: minnumst-admin
        RUNTIME_CONFIG_KEYS: VITE_API_URL DEBUG
    environment:
      VITE_API_URL: http://127.0.0.1:8000
    ports:
      - "127.0.0.1:5174:8080"

  api:
    image: minnumst-local/api:dev
    build:
      context: ../../..
      dockerfile: docker/api.Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      CORS_ORIGINS: http://127.0.0.1:5173,http://127.0.0.1:5174

  # The seed and end-to-end scripts run here (`docker compose run migrate …`):
  # it holds the schema owner's credentials and reaches the API on `backend`.
  migrate:
    image: minnumst-local/api:dev
    volumes:
      - ../../../tools/scripts/seed_local_db.py:/opt/minnumst/seed_local_db.py:ro
      - ../../../tools/scripts/e2e_api.py:/opt/minnumst/e2e_api.py:ro
