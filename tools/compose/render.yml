---
- name: Render local Minnumst Compose configuration
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars_files:
    - ../../deploy/inventory/group_vars/all/vars.yml
  tasks:
    - name: Create private generated configuration directory
      ansible.builtin.file:
        path: "{{ playbook_dir }}/.local"
        state: directory
        mode: "0700"

    - name: Install the PostgreSQL role setup script and Authentik's blueprint
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../deploy/roles/minnumst/files/{{ item }}"
        dest: "{{ playbook_dir }}/.local/{{ item }}"
        mode: "0644"
      loop: [postgres-roles.sh, authentik-blueprint.yaml]

    - name: Render deployment Compose template
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../deploy/roles/minnumst/templates/compose.yml.j2"
        dest: "{{ playbook_dir }}/.local/compose.yml"
        mode: "0600"
